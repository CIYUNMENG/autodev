<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDev Agent - 聊天式项目生成</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0;
      background: #0f1419;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: #58a6ff;
    }
    .header a {
      color: #8b949e;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .header a:hover { color: #58a6ff; }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #238636;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 4px;
    }
    .msg.loading {
      color: #8b949e;
      font-style: italic;
    }
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .input-area textarea {
      flex: 1;
      min-width: 200px;
      min-height: 44px;
      max-height: 120px;
      padding: 0.75rem 1rem;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #0d1117;
      color: #e6edf3;
      font: inherit;
      resize: vertical;
    }
    .input-area textarea:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
    }
    .input-area textarea::placeholder { color: #6e7681; }
    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: #238636;
      color: #fff;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled {
      background: #21262d;
      color: #6e7681;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
    }
    .btn-secondary:hover { background: #30363d; }
    .btn-secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .progress-box {
      margin-top: 1rem;
      padding: 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 0.875rem;
    }
    .progress-box a { color: #58a6ff; }
  </style>
</head>
<body>
  <header class="header">
    <h1>AutoDev Agent</h1>
    <a href="/docs">API 文档</a>
  </header>
  <main class="chat-area" id="chat"></main>
  <div class="input-area">
    <textarea id="input" placeholder="描述你的项目，例如：一个 Python 命令行待办工具，支持增删查改..." rows="2"></textarea>
    <button class="btn btn-primary" id="send">发送</button>
    <button class="btn btn-secondary" id="generate" disabled>开始生成</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const genBtn = document.getElementById('generate');

    let sessionId = '';
    let isSufficient = false;
    let currentTaskId = '';
    let pollTimer = null;

    function addMsg(role, content, isLoading = false) {
      const div = document.createElement('div');
      div.className = 'msg ' + role + (isLoading ? ' loading' : '');
      div.textContent = content;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function setGenerateEnabled(enabled) {
      genBtn.disabled = !enabled;
      isSufficient = enabled;
    }

    async function post(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify(body),
      });
      const text = await r.text();
      if (!r.ok) throw new Error(text || 'HTTP ' + r.status);
      try {
        return text ? JSON.parse(text) : {};
      } catch (_) {
        throw new Error('响应解析失败: ' + text.slice(0, 100));
      }
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      input.value = '';
      addMsg('user', msg);
      sendBtn.disabled = true;
      const msgDiv = addMsg('assistant', '', false);
      msgDiv.textContent = '';
      try {
        const r = await fetch('/api/chat/message/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({ message: msg, session_id: sessionId || undefined }),
        });
        if (!r.ok) throw new Error(await r.text() || 'HTTP ' + r.status);
        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop() || '';
          for (const block of parts) {
            let eventType = '';
            let eventData = '';
            for (const line of block.split('\n')) {
              if (line.startsWith('event: ')) eventType = line.slice(7).trim();
              else if (line.startsWith('data: ')) eventData = line.slice(6);
            }
            if (eventType === 'chunk' && eventData) {
              try {
                const obj = JSON.parse(eventData);
                if (obj.text) msgDiv.textContent += obj.text;
              } catch (_) {}
            } else if (eventType === 'done' && eventData) {
              try {
                const obj = JSON.parse(eventData);
                sessionId = obj.session_id || sessionId;
                if (obj.reply) msgDiv.textContent = obj.reply;
                setGenerateEnabled(!!obj.is_sufficient);
              } catch (_) {}
            } else if (eventType === 'error' && eventData) {
              try {
                const obj = JSON.parse(eventData);
                msgDiv.textContent = '错误：' + (obj.error || '未知错误');
              } catch (_) { msgDiv.textContent = '错误：' + eventData; }
            }
          }
          chat.scrollTop = chat.scrollHeight;
        }
        if (buffer.trim()) {
          let eventType = '', eventData = '';
          for (const line of buffer.split('\n')) {
            if (line.startsWith('event: ')) eventType = line.slice(7).trim();
            else if (line.startsWith('data: ')) eventData = line.slice(6);
          }
          if (eventType === 'done' && eventData) {
            try {
              const obj = JSON.parse(eventData);
              sessionId = obj.session_id || sessionId;
              if (obj.reply) msgDiv.textContent = obj.reply;
              setGenerateEnabled(!!obj.is_sufficient);
            } catch (_) {}
          } else if (eventType === 'error' && eventData) {
            try {
              const obj = JSON.parse(eventData);
              msgDiv.textContent = '错误：' + (obj.error || '未知错误');
            } catch (_) {}
          }
        }
      } catch (e) {
        msgDiv.textContent = '请求失败：' + (e.message || String(e));
        console.error('sendMessage error:', e);
      }
      sendBtn.disabled = false;
    }

    async function startGenerate() {
      if (!sessionId || !isSufficient) return;
      genBtn.disabled = true;
      genBtn.textContent = '生成中...';
      try {
        const res = await post('/api/chat/generate', { session_id: sessionId });
        currentTaskId = res.task_id;
        const box = document.createElement('div');
        box.className = 'progress-box';
        box.innerHTML = `任务 ID：<code>${res.task_id}</code><br>生成已启动，正在轮询进度...`;
        chat.appendChild(box);
        chat.scrollTop = chat.scrollHeight;
        pollProgress(box);
      } catch (e) {
        addMsg('assistant', '启动失败：' + e.message);
        genBtn.disabled = false;
        genBtn.textContent = '开始生成';
      }
    }

    function pollProgress(box) {
      if (!currentTaskId) return;
      const doPoll = async () => {
        let state;
        try {
          const r = await fetch('/api/chat/progress/' + currentTaskId);
          state = await r.json();
        } catch (e) {
          box.innerHTML = '轮询出错：' + e.message;
          return;
        }
        try {
          if (!state || state.error) {
            box.innerHTML = `任务 ID：<code>${currentTaskId}</code><br>状态：${state?.error || '任务已结束或不存在'}`;
            clearInterval(pollTimer);
            genBtn.disabled = false;
            genBtn.textContent = '开始生成';
            return;
          }
          const phase = state.phase || '';
          const progress = state.progress || {};
          const phaseMap = {
            init: '初始化',
            requirement_analysis: '需求分析',
            requirement_insufficient: '需求不足',
            planning: '规划中',
            code_generation: '代码生成',
            completed: '已完成',
            failed: '失败',
          };
          const phaseName = phaseMap[phase] || phase;
          let html = `任务 ID：<code>${currentTaskId}</code><br>阶段：${phaseName}<br>`;
          if (progress.current_step) html += `当前：${progress.current_step}<br>`;
          if (progress.completed_files != null && progress.total_files != null)
            html += `文件：${progress.completed_files}/${progress.total_files}<br>`;
          if (state.output_path) {
            html += `<br>输出目录：<code>${state.output_path}</code>`;
          }
          if (phase === 'completed') {
            html += '<br><br>✓ 生成完成';
            genBtn.disabled = false;
            genBtn.textContent = '开始生成';
            currentTaskId = '';
            clearInterval(pollTimer);
            box.innerHTML = html;
            return;
          }
          if (phase === 'failed') {
            html += '<br><br>✗ 生成失败：' + (state.error_log?.[0]?.error || '未知错误');
            genBtn.disabled = false;
            genBtn.textContent = '开始生成';
            currentTaskId = '';
            clearInterval(pollTimer);
            box.innerHTML = html;
            return;
          }
          box.innerHTML = html;
        } catch (e) {
          box.innerHTML = '轮询出错：' + e.message;
        }
      };
      doPoll();
      pollTimer = setInterval(doPoll, 1500);
    }

    sendBtn.onclick = sendMessage;
    genBtn.onclick = startGenerate;
    input.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    addMsg('assistant', '你好！请描述你想创建的项目，我会帮你分析需求。如果信息不足，我会提示你补充。');
  </script>
</body>
</html>
