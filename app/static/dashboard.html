<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoDev Agent - 任务仪表盘</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-body: linear-gradient(180deg, #0d1117 0%, #161b22 100%);
      --color-text: #e6edf3;
      --color-muted: #8b949e;
      --color-accent: #58a6ff;
      --bg-header: rgba(13, 17, 23, 0.9);
      --border-color: rgba(48, 54, 61, 0.5);
      --bg-card: linear-gradient(135deg, #161b22 0%, #21262d 100%);
      --bg-refresh: #21262d;
      --border-refresh: #30363d;
    }
    html[data-theme="light"] {
      --bg-body: linear-gradient(180deg, #f6f8fa 0%, #eaeef2 100%);
      --color-text: #1f2328;
      --color-muted: #656d76;
      --color-accent: #0969da;
      --bg-header: rgba(255, 255, 255, 0.95);
      --border-color: rgba(31, 35, 40, 0.15);
      --bg-card: linear-gradient(135deg, #ffffff 0%, #f6f8fa 100%);
      --bg-refresh: #f6f8fa;
      --border-refresh: rgba(31, 35, 40, 0.15);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      margin: 0;
      background: var(--bg-body);
      color: var(--color-text);
      min-height: 100vh;
      line-height: 1.6;
    }
    .theme-reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      pointer-events: none;
      --reveal-x: 50%;
      --reveal-y: 50%;
      --reveal-r: 0;
      mask-image: radial-gradient(circle at var(--reveal-x) var(--reveal-y), transparent 0, transparent var(--reveal-r), black var(--reveal-r));
      -webkit-mask-image: radial-gradient(circle at var(--reveal-x) var(--reveal-y), transparent 0, transparent var(--reveal-r), black var(--reveal-r));
      mask-size: 100% 100%;
      -webkit-mask-size: 100% 100%;
    }
    .header {
      padding: 0.875rem 1.5rem;
      background: var(--bg-header);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      margin: 0;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--color-accent);
      letter-spacing: -0.02em;
    }
    .header-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .header a {
      color: var(--color-muted);
      text-decoration: none;
      font-size: 0.875rem;
    }
    .header a:hover { color: var(--color-accent); }
    .theme-toggle {
      background: none;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 1.1rem;
      line-height: 1;
    }
    .theme-toggle:hover { color: var(--color-accent); }
    .refresh-btn {
      padding: 0.5rem 1rem;
      background: var(--bg-refresh);
      border: 1px solid var(--border-refresh);
      border-radius: 8px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 0.875rem;
    }
    .refresh-btn:hover { filter: brightness(1.1); }
    .content {
      padding: 1.5rem;
      max-width: 720px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .task-card {
      padding: 1.25rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .task-card:hover {
      border-color: var(--color-muted);
    }
    .task-card h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text);
    }
    .task-card .topic {
      color: var(--color-muted);
      font-size: 0.875rem;
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }
    .task-card .meta {
      font-size: 0.8125rem;
      color: var(--color-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .task-card .phase {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .task-card .phase.running {
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
    }
    .task-card .phase.completed {
      background: rgba(56, 139, 253, 0.2);
      color: #58a6ff;
    }
    .task-card .phase.failed {
      background: rgba(218, 54, 51, 0.2);
      color: #f85149;
    }
    .task-card .phase.pending {
      background: var(--bg-refresh);
      color: var(--color-muted);
    }
    .task-card a {
      color: var(--color-accent);
      text-decoration: none;
    }
    .task-card a:hover { text-decoration: underline; }
    .empty {
      padding: 3rem 2rem;
      text-align: center;
      color: var(--color-muted);
      font-size: 0.9375rem;
    }
    .empty a {
      color: var(--color-accent);
      text-decoration: none;
    }
    .empty a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="header">
    <h1>AutoDev Agent - 仪表盘</h1>
    <div class="header-links">
      <button class="theme-toggle" id="themeToggle" title="切换白天/黑夜模式" aria-label="切换主题">🌙</button>
      <a href="/chat">聊天</a>
      <a href="/docs">API 文档</a>
      <button class="refresh-btn" id="refresh">刷新</button>
    </div>
  </header>
  <main class="content">
    <section>
      <h2 class="section-title">所有任务</h2>
      <div id="tasks"></div>
    </section>
  </main>
  <script>
    (function initTheme() {
      const key = 'autodev-theme';
      const theme = localStorage.getItem(key) || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      const themeBtn = document.getElementById('themeToggle');
      if (themeBtn) {
        themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
        themeBtn.title = theme === 'light' ? '切换到黑夜模式' : '切换到白天模式';
        themeBtn.onclick = () => {
          const current = document.documentElement.getAttribute('data-theme') || 'dark';
          const next = current === 'light' ? 'dark' : 'light';
          const rect = themeBtn.getBoundingClientRect();
          const x = rect.left + rect.width / 2;
          const y = rect.top + rect.height / 2;
          const maxR = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 50;
          const overlay = document.createElement('div');
          overlay.className = 'theme-reveal-overlay';
          overlay.style.setProperty('--reveal-x', x + 'px');
          overlay.style.setProperty('--reveal-y', y + 'px');
          overlay.style.setProperty('--reveal-r', '0px');
          overlay.style.background = current === 'dark' ? '#0d1117' : '#f0f3f6';
          document.body.appendChild(overlay);
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem(key, next);
          themeBtn.textContent = next === 'light' ? '🌙' : '☀️';
          themeBtn.title = next === 'light' ? '切换到黑夜模式' : '切换到白天模式';
          requestAnimationFrame(() => {
            const start = performance.now();
            const duration = 600;
            function tick(now) {
              const t = Math.min((now - start) / duration, 1);
              const eased = 1 - Math.pow(1 - t, 2);
              overlay.style.setProperty('--reveal-r', (eased * maxR) + 'px');
              if (t < 1) requestAnimationFrame(tick);
              else overlay.remove();
            }
            requestAnimationFrame(tick);
          });
        };
      }
    })();

    const tasksEl = document.getElementById('tasks');
    const refreshBtn = document.getElementById('refresh');

    const phaseMap = {
      init: { label: '初始化', cls: 'pending' },
      requirement_analysis: { label: '需求分析', cls: 'running' },
      requirement_insufficient: { label: '需求不足', cls: 'failed' },
      planning: { label: '规划中', cls: 'running' },
      code_generation: { label: '代码生成', cls: 'running' },
      completed: { label: '已完成', cls: 'completed' },
      failed: { label: '失败', cls: 'failed' },
    };

    function phaseLabel(phase) {
      const p = phaseMap[phase] || { label: phase || '-', cls: 'pending' };
      return `<span class="phase ${p.cls}">${p.label}</span>`;
    }

    function loadTasks() {
      fetch('/api/tasks')
        .then(r => r.json())
        .then(data => {
          const tasks = data.tasks || [];
          if (tasks.length === 0) {
            tasksEl.innerHTML = '<p class="empty">暂无任务。<br>前往 <a href="/chat">聊天</a> 创建项目。</p>';
            return;
          }
          tasksEl.innerHTML = tasks.map(t => {
            const p = phaseMap[t.phase] || { label: t.phase || '-', cls: 'pending' };
            const isDone = t.phase === 'completed' || t.phase === 'failed';
            const metaParts = [`任务 ID：${t.task_id}`, phaseLabel(t.phase)];
            if (t.progress && t.progress.completed_files != null && t.progress.total_files != null && !isDone) {
              metaParts.push(`文件 ${t.progress.completed_files}/${t.progress.total_files}`);
            }
            if (t.updated_at) {
              metaParts.push(new Date(t.updated_at).toLocaleString('zh-CN'));
            }
            let output = '';
            if (t.output_path) {
              output = ` · <a href="file:///${t.output_path.replace(/\\/g, '/')}" target="_blank">打开输出目录</a>`;
            }
            return `
              <div class="task-card">
                <h3>${t.topic ? t.topic.slice(0, 70) + (t.topic.length > 70 ? '...' : '') : '(无主题)'}</h3>
                <div class="topic">${(t.topic || '').slice(0, 150)}</div>
                <div class="meta">${metaParts.join(' · ')}${output}</div>
              </div>
            `;
          }).join('');
        })
        .catch(e => {
          tasksEl.innerHTML = '<p class="empty">加载失败：' + (e.message || String(e)) + '</p>';
        });
    }

    refreshBtn.onclick = loadTasks;
    loadTasks();
    setInterval(loadTasks, 3000);
  </script>
</body>
</html>
